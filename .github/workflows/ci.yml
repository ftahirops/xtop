name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Build main binary
        env:
          CGO_ENABLED: '0'
        run: go build ./...
      - name: Build xtop-agent
        env:
          CGO_ENABLED: '0'
        run: go build -o /tmp/xtop-agent ./cmd/xtop-agent
      - name: Run go vet
        run: go vet ./...

  agent-leanness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Check agent does not import heavy packages
        run: |
          if go list -deps ./cmd/xtop-agent | grep -E 'bubbletea|lipgloss|/ui$'; then
            echo "Agent imports forbidden heavy packages"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Run tests
        env:
          CGO_ENABLED: '0'
        run: go test ./...

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Run race detector
        env:
          CGO_ENABLED: '1'
        run: go test -race ./...

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Generate coverage profile
        env:
          CGO_ENABLED: '0'
        run: go test -coverprofile=cover.out ./engine/...
      - name: Display coverage summary
        run: go tool cover -func=cover.out | tail -1
